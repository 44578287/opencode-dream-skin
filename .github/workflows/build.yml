name: Build web + APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_AUTH_ENABLED: "false"
  NODE_VERSION: "22"

jobs:
  web:
    name: 本体 (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build web
        run: npm run build

      - name: Prepare Capacitor www
        run: |
          npm run preview > preview.log 2>&1 &
          preview_pid=$!
          if ! timeout 90 bash -c 'until curl -sf -o /dev/null --max-time 1 http://127.0.0.1:8081/; do sleep 1; done'; then
            echo "vite preview failed to start"
            cat preview.log
            kill "$preview_pid" || true
            exit 1
          fi
          node scripts/prepare-apk-www.mjs --from-preview http://127.0.0.1:8081/
          kill "$preview_pid" || true
          grep -q '$_TSR' android-www/index.html
          grep -q 'desktop-scene' android-www/index.html

      - name: Smoke android-www
        run: |
          npx playwright install --with-deps chromium
          node scripts/apk-www-smoke.mjs

      - name: Pack 本体 zip
        run: |
          mkdir -p release
          (cd .vercel/output && zip -r "$GITHUB_WORKSPACE/release/opencode-web.zip" .)
          (cd android-www && zip -r "$GITHUB_WORKSPACE/release/opencode-android-www.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-web
          path: |
            release/opencode-web.zip
            release/opencode-android-www.zip
            android-www
          if-no-files-found: error

  apk:
    name: APK
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore android-www
        uses: actions/download-artifact@v4
        with:
          name: opencode-web
          path: _web_artifact

      - name: Place www
        run: |
          rm -rf android-www
          cp -a _web_artifact/android-www android-www

      - name: Install JS deps
        run: npm install --no-audit --no-fund

      - name: Capacitor Android
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android
          node scripts/patch-android.mjs

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK ships SSR HTML
        run: |
          APK=$(find android/app/build/outputs -name '*.apk' | head -n 1)
          test -n "$APK"
          unzip -p "$APK" assets/public/index.html > /tmp/apk-index.html
          grep -q '$_TSR' /tmp/apk-index.html
          grep -q 'desktop-scene' /tmp/apk-index.html
          wc -c /tmp/apk-index.html

      - name: Stage APK
        run: |
          mkdir -p release
          APK=$(find android/app/build/outputs -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" release/OpenCode.apk
          ZIP=$(find _web_artifact -name 'opencode-web.zip' | head -n 1)
          test -n "$ZIP"
          cp "$ZIP" release/opencode-web.zip
          ls -lh release

      - uses: actions/upload-artifact@v4
        with:
          name: opencode-apk
          path: release/OpenCode.apk
          if-no-files-found: error

      - name: Publish nightly
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly
          prerelease: true
          files: |
            release/OpenCode.apk
            release/opencode-web.zip
          body: |
            GitHub Actions 自动构建 `#${{ github.run_number }}`
            - **APK** `OpenCode.apk`（debug，可直接安装）
            - **本体** `opencode-web.zip`（Vercel/Nitro 产物）

            commit `${{ github.sha }}`

            打开应能看到 OpenCode 界面（会话 / 连接主机）。若仍是全黑，卸掉旧包再装这一份。

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/OpenCode.apk
            release/opencode-web.zip
          generate_release_notes: true
